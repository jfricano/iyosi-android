name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Publish design screenshots
        # Opt-in: a pushed commit whose message contains [update screenshots]
        # publishes the fixture renders to the design-screenshots branch for
        # review as a single commit holding only the images, leaving the pushed
        # branch and its history untouched.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[update screenshots]')
        run: |
          mkdir -p docs/design
          cp app/build/outputs/roborazzi/*.png docs/design/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan design-screenshots
          git rm -rq --cached .
          git add docs/design
          git commit -m "Design screenshots for ${GITHUB_SHA::7}"
          git push --force origin HEAD:refs/heads/design-screenshots
      - name: Build debug and release
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iyosi-android-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            app/build/outputs/roborazzi/**
          if-no-files-found: ignore
