plugins { id 'com.android.application' }

android {
    namespace 'com.orcasolutions.iyosi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.orcasolutions.iyosi'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'API_BASE_URL', '"' + (project.findProperty('iyosiApiUrl') ?: 'http://10.0.2.2:8000') + '"'
        buildConfigField 'String', 'TILE_URL', '"' + (project.findProperty('iyosiTileUrl') ?: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png') + '"'
        buildConfigField 'String', 'TILE_ATTRIBUTION', '"' + (project.findProperty('iyosiTileAttribution') ?: '© OpenStreetMap contributors') + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { manifestPlaceholders = [cleartextAllowed: 'true'] }
        release { manifestPlaceholders = [cleartextAllowed: 'false'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
